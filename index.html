<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0f172a;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:95%;
max-width:1000px;
height:90vh;
background:#1e293b;
border-radius:20px;
overflow:hidden;
display:flex;
box-shadow:0 0 20px rgba(0,0,0,0.4);
}

.sidebar{
width:250px;
background:#111827;
padding:20px;
color:white;
border-right:1px solid #334155;
}

.sidebar h2{
margin-bottom:10px;
}

.sidebar p{
color:#94a3b8;
}

.chat-area{
flex:1;
display:flex;
flex-direction:column;
background:#0f172a;
}

.header{
padding:20px;
background:#1e293b;
color:white;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #334155;
}

#messages{
flex:1;
padding:20px;
overflow-y:auto;
display:flex;
flex-direction:column;
}

.message{
padding:12px;
margin:10px 0;
border-radius:15px;
max-width:70%;
color:white;
word-wrap:break-word;
}

.me{
background:#2563eb;
align-self:flex-end;
}

.other{
background:#334155;
align-self:flex-start;
}

.send-box{
display:flex;
padding:15px;
background:#1e293b;
border-top:1px solid #334155;
}

.send-box input{
flex:1;
padding:14px;
border:none;
outline:none;
border-radius:12px;
font-size:16px;
}

.send-box button{
margin-left:10px;
padding:14px 20px;
background:#2563eb;
color:white;
border:none;
border-radius:12px;
cursor:pointer;
font-size:16px;
transition:0.3s;
}

.send-box button:hover{
background:#1d4ed8;
}

@media(max-width:700px){

.sidebar{
display:none;
}

.container{
width:100%;
height:100vh;
border-radius:0;
}

}

</style>

</head>

<body>

<div class="container">

<div class="sidebar">
<h2>💬 Chat Pro</h2>
<p>دردشة مباشرة احترافية</p>
</div>

<div class="chat-area">

<div class="header">
Chat Pro
</div>

<div id="messages"></div>

<div class="send-box">
<input type="text" id="messageInput" placeholder="اكتب رسالة...">
<button id="sendBtn">إرسال</button>
</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
onSnapshot,
query,
orderBy
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "ضع API KEY هنا",

authDomain: "YOUR_PROJECT.firebaseapp.com",

projectId: "YOUR_PROJECT",

storageBucket: "YOUR_PROJECT.appspot.com",

messagingSenderId: "123456789",

appId: "YOUR_APP_ID"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const messages = document.getElementById("messages");

const input = document.getElementById("messageInput");

const sendBtn = document.getElementById("sendBtn");

async function sendMessage(){

if(input.value.trim() === "") return;

await addDoc(collection(db,"messages"),{

text: input.value,
time: Date.now()

});

input.value = "";

}

sendBtn.addEventListener("click",sendMessage);

input.addEventListener("keypress",(e)=>{

if(e.key === "Enter"){

sendMessage();

}

});

const q = query(
collection(db,"messages"),
orderBy("time")
);

onSnapshot(q,(snapshot)=>{

messages.innerHTML = "";

snapshot.forEach((doc)=>{

const data = doc.data();

const div = document.createElement("div");

div.classList.add("message");

div.classList.add(
Math.random() > 0.5 ? "me" : "other"
);

div.innerText = data.text;

messages.appendChild(div);

});

messages.scrollTop = messages.scrollHeight;

});

</script>

</body>
</html>
