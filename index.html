<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Finger Scanner</title>

<style>
body{
margin:0;
font-family:Arial;
background: radial-gradient(circle,#0a0014,#05010a);
color:white;
text-align:center;
padding-top:60px;
}

h1{
color:#c084fc;
text-shadow:0 0 15px #c084fc;
}

p{
color:#aaa;
}

.scanner{
width:280px;
height:280px;
margin:50px auto;
border-radius:30px;
background:rgba(255,255,255,0.03);
border:2px solid #c084fc;
box-shadow:0 0 30px #c084fc;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
cursor:pointer;
position:relative;
overflow:hidden;
transition:0.3s;
}

.scanner:hover{
transform:scale(1.05);
}

.thumb{
font-size:90px;
filter: drop-shadow(0 0 10px #c084fc);
}

.scan-line{
position:absolute;
width:100%;
height:6px;
background:linear-gradient(90deg,transparent,#c084fc,transparent);
top:0;
animation:none;
box-shadow:0 0 20px #c084fc;
}

@keyframes scan{
0%{top:0;}
50%{top:100%;}
100%{top:0;}
}

.box{
width:320px;
margin:20px auto;
padding:20px;
background:rgba(255,255,255,0.05);
border-radius:15px;
border:1px solid #c084fc;
min-height:70px;
box-shadow:0 0 20px #c084fc;
font-size:18px;
}

.btn{
background:#c084fc;
border:none;
padding:10px 20px;
color:white;
border-radius:10px;
cursor:pointer;
margin-top:10px;
box-shadow:0 0 15px #c084fc;
}
</style>
</head>

<body>

<h1>💜 Finger AI Scanner</h1>
<p>اضغط بالإبهام للحصول على مكافأة أو كلمة طيبة</p>

<div class="scanner" onclick="scan()">

<div class="scan-line" id="line"></div>

<div class="thumb">👍</div>

</div>

<div class="box" id="result">جاهز للمسح...</div>

<button class="btn" onclick="scan()">تشغيل المسح</button>

<script>
function scan(){

let line = document.getElementById("line");
let box = document.getElementById("result");

// تشغيل المسح
line.style.animation = "scan 1.2s linear 2";

box.innerHTML = "🤖 يتم تحليل بصمة الإبهام...";

setTimeout(()=>{

let results = [
"💰 +5$ مكافأة داخل اللعبة",
"💰 +3$ حظ مالي جيد",
"💎 +10 نقاط حظ",
"🔥 فرصة قوية اليوم",
"⭐ كلمة طيبة: أنت شخص مميز 💜",
"❤️ رسالة: استمر ولا تتوقف",
"🚀 نجاح قريب جدًا منك",
"🌟 يومك سيكون جميل",
"🎁 هدية حظ: +5$",
"💜 رسالة AI: أنت في الطريق الصحيح"
];

let random = Math.floor(Math.random()*results.length);

box.innerHTML = "🔮 " + results[random];

},2000);
}
</script>

</body>
</html>

<audio id="scanSound">
<source src="https://actions.google.com/sounds/v1/science_fiction/robot_power_up.ogg" type="audio/ogg">
</audio>
