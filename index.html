<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔥 Galaxy Chat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#020617;
overflow:hidden;
height:100vh;
}

/* خلفية متحركة */

.stars{
position:absolute;
width:100%;
height:100%;
background:url('https://i.imgur.com/YKY28eT.png');
animation:moveStars 100s linear infinite;
opacity:0.4;
}

@keyframes moveStars{
from{
transform:translateY(0);
}
to{
transform:translateY(-2000px);
}
}

/* شاشة البداية */

.intro{
position:fixed;
width:100%;
height:100vh;
background:radial-gradient(circle,#0f172a,#020617);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
color:white;
animation:hideIntro 5s forwards;
}

.intro h1{
font-size:80px;
font-weight:900;
background:linear-gradient(90deg,#60a5fa,#a855f7,#ec4899);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:pulse 2s infinite;
}

.intro p{
font-size:22px;
opacity:0.8;
margin-top:10px;
}

@keyframes pulse{
0%{
transform:scale(1);
}
50%{
transform:scale(1.08);
}
100%{
transform:scale(1);
}
}

@keyframes hideIntro{
0%{
opacity:1;
visibility:visible;
}
85%{
opacity:1;
}
100%{
opacity:0;
visibility:hidden;
}
}

/* الحاوية */

.container{
position:relative;
width:95%;
max-width:1400px;
height:92vh;
margin:20px auto;
display:flex;
border-radius:30px;
overflow:hidden;
backdrop-filter:blur(20px);
background:rgba(15,23,42,0.7);
border:1px solid rgba(255,255,255,0.1);
box-shadow:0 0 50px rgba(0,0,0,0.5);
}

/* القائمة */

.sidebar{
width:300px;
background:rgba(15,23,42,0.9);
padding:30px;
color:white;
border-right:1px solid rgba(255,255,255,0.08);
}

.logo{
font-size:40px;
font-weight:900;
margin-bottom:15px;
background:linear-gradient(90deg,#60a5fa,#c084fc);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.desc{
color:#94a3b8;
line-height:2;
font-size:15px;
}

.menu{
margin-top:40px;
}

.menu div{
padding:15px;
margin:10px 0;
background:rgba(255,255,255,0.05);
border-radius:15px;
cursor:pointer;
transition:0.3s;
}

.menu div:hover{
background:#2563eb;
transform:translateX(5px);
}

/* الدردشة */

.chat-area{
flex:1;
display:flex;
flex-direction:column;
}

/* الهيدر */

.header{
padding:25px;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(30,41,59,0.8);
border-bottom:1px solid rgba(255,255,255,0.08);
color:white;
}

.user{
display:flex;
align-items:center;
}

.avatar{
width:50px;
height:50px;
border-radius:50%;
background:linear-gradient(135deg,#2563eb,#9333ea);
display:flex;
justify-content:center;
align-items:center;
font-size:20px;
margin-right:15px;
}

.status{
color:#4ade80;
font-size:14px;
}

/* الرسائل */

#messages{
flex:1;
padding:25px;
overflow-y:auto;
display:flex;
flex-direction:column;
}

.message{
max-width:70%;
padding:16px 20px;
margin:12px 0;
border-radius:20px;
color:white;
font-size:16px;
animation:show 0.3s ease;
}

.me{
align-self:flex-end;
background:linear-gradient(135deg,#2563eb,#3b82f6);
}

.other{
align-self:flex-start;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
}

@keyframes show{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* صندوق الكتابة */

.send-box{
display:flex;
padding:20px;
background:rgba(15,23,42,0.9);
border-top:1px solid rgba(255,255,255,0.08);
}

.send-box input{
flex:1;
padding:18px;
border:none;
outline:none;
border-radius:20px;
background:rgba(255,255,255,0.08);
color:white;
font-size:16px;
}

.send-box button{
margin-left:15px;
padding:18px 28px;
border:none;
border-radius:20px;
background:linear-gradient(135deg,#2563eb,#9333ea);
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

.send-box button:hover{
transform:scale(1.05);
}

/* الهاتف */

@media(max-width:900px){

.sidebar{
display:none;
}

.container{
width:100%;
height:100vh;
margin:0;
border-radius:0;
}

.intro h1{
font-size:50px;
}

}

</style>

</head>

<body>

<div class="stars"></div>

<div class="intro">
<h1>Galaxy Chat</h1>
<p>منصة دردشة خرافية مستقبلية 🚀</p>
</div>

<div class="container">

<div class="sidebar">

<div class="logo">
Galaxy Chat
</div>

<div class="desc">
منصة دردشة احترافية بتصميم مستقبلي مذهل مع تأثيرات حديثة وتجربة مستخدم قوية.
</div>

<div class="menu">
<div>🏠 الرئيسية</div>
<div>💬 الدردشة</div>
<div>👥 الأصدقاء</div>
<div>⚙️ الإعدادات</div>
</div>

</div>

<div class="chat-area">

<div class="header">

<div class="user">
<div class="avatar">A</div>

<div>
<div>Ayoub</div>
<div class="status">● متصل الآن</div>
</div>

</div>

<div>
🚀 Galaxy Server
</div>

</div>

<div id="messages">

<div class="message other">
مرحبا بك في Galaxy Chat 🚀
</div>

<div class="message me">
هذا الموقع خرافي 🔥
</div>

</div>

<div class="send-box">

<input type="text" id="messageInput" placeholder="اكتب رسالة...">

<button id="sendBtn">
إرسال
</button>

</div>

</div>

</div>

<script>

const input = document.getElementById("messageInput");

const sendBtn = document.getElementById("sendBtn");

const messages = document.getElementById("messages");

function sendMessage(){

if(input.value.trim() === "") return;

const div = document.createElement("div");

div.classList.add("message");

div.classList.add("me");

div.innerText = input.value;

messages.appendChild(div);

messages.scrollTop = messages.scrollHeight;

input.value = "";

}

sendBtn.addEventListener("click",sendMessage);

input.addEventListener("keypress",(e)=>{

if(e.key === "Enter"){

sendMessage();

}

});

</script>

</body>
</html>
