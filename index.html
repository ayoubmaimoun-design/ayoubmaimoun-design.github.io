<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>بصمة المستقبل</title>

<style>
body{
margin:0;
font-family:Arial;
background: radial-gradient(circle,#0f172a,#020617);
color:white;
text-align:center;
overflow:hidden;
}

h1{
margin-top:40px;
color:#38bdf8;
text-shadow:0 0 10px #38bdf8;
}

.hand{
font-size:140px;
margin:40px;
cursor:pointer;
transition:0.3s;
filter: drop-shadow(0 0 10px #38bdf8);
}

.hand:hover{
transform:scale(1.15) rotate(5deg);
}

.box{
width:320px;
margin:20px auto;
padding:20px;
background:rgba(255,255,255,0.05);
border:1px solid #38bdf8;
border-radius:20px;
font-size:20px;
min-height:60px;
box-shadow:0 0 20px #38bdf8;
}

.btn{
background:#38bdf8;
border:none;
padding:12px 25px;
border-radius:10px;
color:white;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

.glow{
animation: glow 1s infinite alternate;
}

@keyframes glow{
from{box-shadow:0 0 10px #38bdf8;}
to{box-shadow:0 0 30px #38bdf8;}
}
</style>
</head>

<body>

<h1>🔮 بصمة المستقبل</h1>

<p>اضغط على اليد لاكتشاف مستقبلك</p>

<div class="hand glow" onclick="predict()">
✋
</div>

<div class="box" id="result">
اضغط الآن...
</div>

<button class="btn" onclick="predict()">
توقع جديد
</button>

<audio id="sound">
<source src="https://actions.google.com/sounds/v1/magic/magic_chime.ogg">
</audio>

<script>
function predict(){

let messages = [
"💰 لديك فرصة ربح قريبًا",
"🎮 ستصبح لاعب محترف",
"🚀 نجاح كبير في طريقك",
"📱 ستتعلم مهارة جديدة",
"🔥 خبر سعيد قريب جدًا",
"⭐ الحظ يرافقك اليوم",
"💡 فكرة ستغير حياتك",
"🌍 فرصة سفر قريبة",
"💼 عمل جديد بانتظارك",
"❤️ شخص يهتم بك سيفاجئك"
];

let random = Math.floor(Math.random()*messages.length);

document.getElementById("result").innerHTML =
messages[random];

// صوت
document.getElementById("sound").play();

// اهتزاز للهاتف
if(navigator.vibrate){
navigator.vibrate(150);
}

// تأثير تغيير
document.getElementById("result").style.transform="scale(1.1)";
setTimeout(()=>{
document.getElementById("result").style.transform="scale(1)";
},200);
}
</script>

</body>
</html>
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>AI Palm</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
text-align:center;
padding-top:60px;
}

h1{
color:#38bdf8;
}

.hand{
font-size:120px;
cursor:pointer;
transition:0.2s;
}

.hand:active{
transform:scale(0.95);
}

.box{
margin:20px auto;
width:300px;
padding:20px;
background:#111827;
border-radius:15px;
border:1px solid #38bdf8;
min-height:60px;
}

.btn{
background:#38bdf8;
border:none;
padding:10px 20px;
color:white;
border-radius:10px;
cursor:pointer;
}
</style>
</head>

<body>

<h1>🤖 AI بصمة المستقبل</h1>

<p>اضغط على اليد واسأل الذكاء الاصطناعي</p>

<div class="hand" onclick="predict()">✋</div>

<div class="box" id="result">جاهز للإجابة...</div>

<button class="btn" onclick="predict()">توقع جديد</button>

<script>
function predict(){

let replies = [
"🤖 تحليل AI: لديك فرصة جيدة هذا الأسبوع",
"🧠 الذكاء الاصطناعي يرى نجاح قريب",
"🔮 تحليل البيانات: طريقك يتحسن",
"📊 AI: تحتاج فقط خطوة صغيرة للنجاح",
"⚡ النظام يتوقع خبر سعيد قريبًا",
"🌍 تحليل: تغيير إيجابي في حياتك",
"💡 AI يقترح: لا تتوقف الآن",
"🚀 فرصة قوية خلال أيام"
];

// اختيار عشوائي (AI بسيط)
let text = replies[Math.floor(Math.random()*replies.length)];

document.getElementById("result").innerHTML = text;
}
</script>

</body>
</html>
