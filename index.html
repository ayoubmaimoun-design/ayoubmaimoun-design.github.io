<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat Pro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#020617;
overflow:hidden;
}

/* شاشة البداية */

.intro{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
z-index:999;
animation:hideIntro 4s forwards;
}

.intro h1{
font-size:60px;
margin-bottom:20px;
animation:zoom 2s infinite alternate;
}

.intro p{
font-size:22px;
opacity:0.8;
}

@keyframes zoom{
from{
transform:scale(1);
}
to{
transform:scale(1.1);
}
}

@keyframes hideIntro{
0%{
opacity:1;
visibility:visible;
}
80%{
opacity:1;
}
100%{
opacity:0;
visibility:hidden;
}
}

/* الخلفية */

.bg{
position:absolute;
width:100%;
height:100%;
background:
radial-gradient(circle at top left,#2563eb33,transparent),
radial-gradient(circle at bottom right,#9333ea33,transparent);
filter:blur(40px);
z-index:-1;
}

/* الحاوية */

.container{
width:95%;
max-width:1200px;
height:92vh;
margin:20px auto;
background:rgba(15,23,42,0.9);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.1);
border-radius:25px;
overflow:hidden;
display:flex;
box-shadow:0 0 40px rgba(0,0,0,0.5);
}

/* القائمة الجانبية */

.sidebar{
width:280px;
background:#0f172a;
padding:25px;
color:white;
border-right:1px solid rgba(255,255,255,0.08);
}

.logo{
font-size:35px;
font-weight:bold;
margin-bottom:15px;
color:#60a5fa;
}

.desc{
color:#94a3b8;
line-height:1.8;
}

/* منطقة الدردشة */

.chat-area{
flex:1;
display:flex;
flex-direction:column;
}

/* الهيدر */

.header{
padding:20px;
background:rgba(30,41,59,0.8);
color:white;
font-size:24px;
font-weight:bold;
border-bottom:1px solid rgba(255,255,255,0.08);
display:flex;
justify-content:space-between;
align-items:center;
}

.online{
font-size:14px;
color:#4ade80;
}

/* الرسائل */

#messages{
flex:1;
padding:25px;
overflow-y:auto;
display:flex;
flex-direction:column;
}

.message{
padding:14px 18px;
margin:10px 0;
border-radius:18px;
max-width:70%;
color:white;
font-size:16px;
animation:show 0.3s ease;
}

.me{
background:linear-gradient(135deg,#2563eb,#3b82f6);
align-self:flex-end;
}

.other{
background:#1e293b;
align-self:flex-start;
}

@keyframes show{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* صندوق الإرسال */

.send-box{
display:flex;
padding:18px;
background:#0f172a;
border-top:1px solid rgba(255,255,255,0.08);
}

.send-box input{
flex:1;
padding:16px;
border:none;
outline:none;
border-radius:15px;
font-size:16px;
background:#1e293b;
color:white;
}

.send-box button{
margin-left:12px;
padding:16px 24px;
background:linear-gradient(135deg,#2563eb,#3b82f6);
color:white;
border:none;
border-radius:15px;
cursor:pointer;
font-size:16px;
transition:0.3s;
}

.send-box button:hover{
transform:scale(1.05);
}

/* الهاتف */

@media(max-width:768px){

.sidebar{
display:none;
}

.container{
width:100%;
height:100vh;
margin:0;
border-radius:0;
}

.intro h1{
font-size:40px;
}

}

</style>

</head>

<body>

<div class="intro">
<h1>💬 Chat Pro</h1>
<p>أفضل منصة دردشة احترافية</p>
</div>

<div class="bg"></div>

<div class="container">

<div class="sidebar">

<div class="logo">
Chat Pro
</div>

<div class="desc">
دردشة مباشرة سريعة وآمنة بتصميم عصري واحترافي يعمل على جميع الأجهزة.
</div>

</div>

<div class="chat-area">

<div class="header">
<span>غرفة الدردشة</span>
<span class="online">● متصل الآن</span>
</div>

<div id="messages">

<div class="message other">
مرحبا بك في Chat Pro 🔥
</div>

</div>

<div class="send-box">
<input type="text" id="messageInput" placeholder="اكتب رسالة...">
<button id="sendBtn">إرسال</button>
</div>

</div>

</div>

<script>

const input = document.getElementById("messageInput");

const sendBtn = document.getElementById("sendBtn");

const messages = document.getElementById("messages");

function sendMessage(){

if(input.value.trim() === "") return;

const div = document.createElement("div");

div.classList.add("message");
div.classList.add("me");

div.innerText = input.value;

messages.appendChild(div);

messages.scrollTop = messages.scrollHeight;

input.value = "";

}

sendBtn.addEventListener("click",sendMessage);

input.addEventListener("keypress",(e)=>{

if(e.key === "Enter"){

sendMessage();

}

});

</script>

</body>
</html>
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0f172a;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:95%;
max-width:1000px;
height:90vh;
background:#1e293b;
border-radius:20px;
overflow:hidden;
display:flex;
box-shadow:0 0 20px rgba(0,0,0,0.4);
}

.sidebar{
width:250px;
background:#111827;
padding:20px;
color:white;
border-right:1px solid #334155;
}

.sidebar h2{
margin-bottom:10px;
}

.sidebar p{
color:#94a3b8;
}

.chat-area{
flex:1;
display:flex;
flex-direction:column;
background:#0f172a;
}

.header{
padding:20px;
background:#1e293b;
color:white;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #334155;
}

#messages{
flex:1;
padding:20px;
overflow-y:auto;
display:flex;
flex-direction:column;
}

.message{
padding:12px;
margin:10px 0;
border-radius:15px;
max-width:70%;
color:white;
word-wrap:break-word;
}

.me{
background:#2563eb;
align-self:flex-end;
}

.other{
background:#334155;
align-self:flex-start;
}

.send-box{
display:flex;
padding:15px;
background:#1e293b;
border-top:1px solid #334155;
}

.send-box input{
flex:1;
padding:14px;
border:none;
outline:none;
border-radius:12px;
font-size:16px;
}

.send-box button{
margin-left:10px;
padding:14px 20px;
background:#2563eb;
color:white;
border:none;
border-radius:12px;
cursor:pointer;
font-size:16px;
transition:0.3s;
}

.send-box button:hover{
background:#1d4ed8;
}

@media(max-width:700px){

.sidebar{
display:none;
}

.container{
width:100%;
height:100vh;
border-radius:0;
}

}

</style>

</head>

<body>

<div class="container">

<div class="sidebar">
<h2>💬 Chat Pro</h2>
<p>دردشة مباشرة احترافية</p>
</div>

<div class="chat-area">

<div class="header">
Chat Pro
</div>

<div id="messages"></div>

<div class="send-box">
<input type="text" id="messageInput" placeholder="اكتب رسالة...">
<button id="sendBtn">إرسال</button>
</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
onSnapshot,
query,
orderBy
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "ضع API KEY هنا",

authDomain: "YOUR_PROJECT.firebaseapp.com",

projectId: "YOUR_PROJECT",

storageBucket: "YOUR_PROJECT.appspot.com",

messagingSenderId: "123456789",

appId: "YOUR_APP_ID"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const messages = document.getElementById("messages");

const input = document.getElementById("messageInput");

const sendBtn = document.getElementById("sendBtn");

async function sendMessage(){

if(input.value.trim() === "") return;

await addDoc(collection(db,"messages"),{

text: input.value,
time: Date.now()

});

input.value = "";

}

sendBtn.addEventListener("click",sendMessage);

input.addEventListener("keypress",(e)=>{

if(e.key === "Enter"){

sendMessage();

}

});

const q = query(
collection(db,"messages"),
orderBy("time")
);

onSnapshot(q,(snapshot)=>{

messages.innerHTML = "";

snapshot.forEach((doc)=>{

const data = doc.data();

const div = document.createElement("div");

div.classList.add("message");

div.classList.add(
Math.random() > 0.5 ? "me" : "other"
);

div.innerText = data.text;

messages.appendChild(div);

});

messages.scrollTop = messages.scrollHeight;

});

</script>

</body>
</html>
