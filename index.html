<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🚀 Galaxy Metaverse</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
overflow:hidden;
background:black;
}

/* واجهة */

.ui{
position:absolute;
top:0;
left:0;
width:100%;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:10;
color:white;
}

.logo{
font-size:35px;
font-weight:900;
background:linear-gradient(90deg,#00ffff,#9333ea,#ff00ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
text-shadow:0 0 20px cyan;
}

.menu{
display:flex;
gap:15px;
}

.menu button{
padding:12px 20px;
border:none;
border-radius:15px;
background:rgba(255,255,255,0.1);
color:white;
cursor:pointer;
backdrop-filter:blur(10px);
transition:0.3s;
}

.menu button:hover{
background:#2563eb;
transform:scale(1.05);
}

/* دردشة */

.chat{
position:absolute;
right:20px;
bottom:20px;
width:320px;
height:420px;
background:rgba(15,23,42,0.8);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.1);
border-radius:20px;
display:flex;
flex-direction:column;
overflow:hidden;
z-index:10;
}

.chat-header{
padding:15px;
background:rgba(255,255,255,0.05);
color:white;
font-weight:bold;
}

.messages{
flex:1;
padding:15px;
overflow-y:auto;
display:flex;
flex-direction:column;
}

.msg{
padding:12px;
margin:8px 0;
border-radius:15px;
max-width:80%;
color:white;
animation:show 0.3s ease;
}

.me{
background:#2563eb;
align-self:flex-end;
}

.bot{
background:#334155;
align-self:flex-start;
}

.input-box{
display:flex;
padding:10px;
background:rgba(255,255,255,0.05);
}

.input-box input{
flex:1;
padding:12px;
border:none;
outline:none;
border-radius:12px;
background:#0f172a;
color:white;
}

.input-box button{
margin-left:10px;
padding:12px 18px;
border:none;
border-radius:12px;
background:#9333ea;
color:white;
cursor:pointer;
}

@keyframes show{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* معلومات */

.info{
position:absolute;
left:20px;
bottom:20px;
color:white;
z-index:10;
background:rgba(15,23,42,0.7);
padding:20px;
border-radius:20px;
backdrop-filter:blur(10px);
}

canvas{
display:block;
}

</style>

</head>

<body>

<div class="ui">

<div class="logo">
🚀 Galaxy Metaverse
</div>

<div class="menu">
<button>🌍 عالم</button>
<button>🤖 AI</button>
<button>💬 دردشة</button>
<button>⚙️ إعدادات</button>
</div>

</div>

<div class="info">
<h2>🪐 عالم ثلاثي الأبعاد</h2>
<p>استكشف المجرة المستقبلية</p>
</div>

<div class="chat">

<div class="chat-header">
💬 Galaxy Chat
</div>

<div class="messages" id="messages">

<div class="msg bot">
مرحبا بك في المجرة 🚀
</div>

</div>

<div class="input-box">

<input type="text" id="messageInput" placeholder="اكتب رسالة...">

<button id="sendBtn">
إرسال
</button>

</div>

</div>

<script type="module">

import * as THREE from 
'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';

/* المشهد */

const scene = new THREE.Scene();

scene.fog = new THREE.Fog(
0x000000,
20,
120
);

/* الكاميرا */

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.z = 15;

/* الرندر */

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.setPixelRatio(window.devicePixelRatio);

document.body.appendChild(renderer.domElement);

/* إضاءة */

const ambient = new THREE.AmbientLight(
0xffffff,
0.5
);

scene.add(ambient);

const light = new THREE.PointLight(
0x00ffff,
2
);

light.position.set(10,10,10);

scene.add(light);

/* كوكب */

const planetGeo =
new THREE.SphereGeometry(4,64,64);

const planetMat =
new THREE.MeshStandardMaterial({

color:0x2563eb,
emissive:0x112244,
metalness:0.6,
roughness:0.2

});

const planet =
new THREE.Mesh(
planetGeo,
planetMat
);

scene.add(planet);

/* حلقة حول الكوكب */

const ringGeo =
new THREE.TorusGeometry(6,0.1,16,100);

const ringMat =
new THREE.MeshBasicMaterial({
color:0x9333ea
});

const ring =
new THREE.Mesh(
ringGeo,
ringMat
);

ring.rotation.x = 1.5;

scene.add(ring);

/* نجوم */

const starsGeometry =
new THREE.BufferGeometry();

const starsCount = 10000;

const positions = [];

for(let i=0;i<starsCount;i++){

positions.push(
(Math.random()-0.5)*2000
);

positions.push(
(Math.random()-0.5)*2000
);

positions.push(
(Math.random()-0.5)*2000
);

}

starsGeometry.setAttribute(
'position',
new THREE.Float32BufferAttribute(
positions,
3
)
);

const starsMaterial =
new THREE.PointsMaterial({
color:0xffffff,
size:0.7
});

const stars =
new THREE.Points(
starsGeometry,
starsMaterial
);

scene.add(stars);

/* مكعبات مستقبلية */

for(let i=0;i<50;i++){

const geo =
new THREE.BoxGeometry(
Math.random()*2,
Math.random()*2,
Math.random()*2
);

const mat =
new THREE.MeshStandardMaterial({

color:Math.random()*0xffffff,
emissive:Math.random()*0x222222

});

const cube =
new THREE.Mesh(geo,mat);

cube.position.x =
(Math.random()-0.5)*50;

cube.position.y =
(Math.random()-0.5)*50;

cube.position.z =
(Math.random()-0.5)*50;

scene.add(cube);

}

/* حركة */

function animate(){

requestAnimationFrame(animate);

planet.rotation.y += 0.003;

ring.rotation.z += 0.002;

stars.rotation.y += 0.0005;

camera.position.x =
Math.sin(Date.now()*0.0002)*2;

camera.lookAt(planet.position);

renderer.render(scene,camera);

}

animate();

/* تغيير الحجم */

window.addEventListener('resize',()=>{

camera.aspect =
window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight

);

});

/* دردشة */

const input =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");

const messages =
document.getElementById("messages");

function addMessage(text,type){

const div =
document.createElement("div");

div.classList.add("msg");

div.classList.add(type);

div.innerText = text;

messages.appendChild(div);

messages.scrollTop =
messages.scrollHeight;

}

function sendMessage(){

if(input.value.trim() === "")
return;

addMessage(input.value,"me");

setTimeout(()=>{

addMessage(
"🤖 AI: مذهل 🚀",
"bot"
);

},1000);

input.value = "";

}

sendBtn.addEventListener(
"click",
sendMessage
);

input.addEventListener(
"keypress",
(e)=>{

if(e.key === "Enter"){

sendMessage();

}

});

</script>

</body>
</html>
