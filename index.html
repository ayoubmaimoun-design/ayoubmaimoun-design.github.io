<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎮 من سيربح المليون</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:
radial-gradient(circle at top,#1e3a8a,#020617);
color:white;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}

.game-container{
width:95%;
max-width:1200px;
height:92vh;
background:rgba(0,0,0,0.4);
backdrop-filter:blur(10px);
border-radius:30px;
display:flex;
overflow:hidden;
box-shadow:0 0 40px rgba(0,0,0,0.5);
}

/* الجوائز */

.money-board{
width:280px;
background:rgba(255,255,255,0.05);
padding:20px;
overflow-y:auto;
}

.money-board h2{
text-align:center;
margin-bottom:20px;
font-size:30px;
color:#facc15;
}

.money{
padding:12px;
margin:10px 0;
border-radius:12px;
background:#111827;
transition:0.3s;
}

.active{
background:#f59e0b;
color:black;
font-weight:bold;
}

/* اللعبة */

.game{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:30px;
position:relative;
}

/* الهيدر */

.top-bar{
position:absolute;
top:20px;
left:20px;
right:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.timer{
width:90px;
height:90px;
border-radius:50%;
background:#2563eb;
display:flex;
justify-content:center;
align-items:center;
font-size:35px;
font-weight:bold;
box-shadow:0 0 20px #2563eb;
}

.level{
font-size:22px;
color:#facc15;
}

/* السؤال */

.question-box{
width:100%;
max-width:800px;
background:linear-gradient(135deg,#1e3a8a,#2563eb);
padding:35px;
border-radius:25px;
font-size:30px;
text-align:center;
margin-bottom:40px;
box-shadow:0 0 30px rgba(37,99,235,0.5);
animation:show 0.5s ease;
}

/* الإجابات */

.answers{
width:100%;
max-width:900px;
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.answer{
padding:22px;
background:#111827;
border-radius:18px;
font-size:22px;
cursor:pointer;
transition:0.3s;
border:2px solid transparent;
}

.answer:hover{
background:#2563eb;
transform:scale(1.03);
}

.correct{
background:#16a34a !important;
}

.wrong{
background:#dc2626 !important;
}

/* أزرار المساعدة */

.help-buttons{
margin-top:30px;
display:flex;
gap:15px;
flex-wrap:wrap;
justify-content:center;
}

.help-buttons button{
padding:14px 20px;
border:none;
border-radius:15px;
background:#9333ea;
color:white;
cursor:pointer;
font-size:16px;
transition:0.3s;
}

.help-buttons button:hover{
transform:scale(1.05);
}

/* شاشة النهاية */

.end-screen{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
text-align:center;
padding:20px;
}

.end-screen h1{
font-size:60px;
margin-bottom:20px;
color:#facc15;
}

.end-screen p{
font-size:28px;
margin-bottom:30px;
}

.end-screen button{
padding:18px 35px;
border:none;
border-radius:18px;
background:#2563eb;
color:white;
font-size:20px;
cursor:pointer;
}

/* حركة */

@keyframes show{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* الهاتف */

@media(max-width:900px){

.game-container{
flex-direction:column;
height:100vh;
border-radius:0;
}

.money-board{
width:100%;
height:180px;
display:flex;
overflow-x:auto;
gap:10px;
}

.money{
min-width:140px;
text-align:center;
}

.question-box{
font-size:22px;
padding:25px;
}

.answers{
grid-template-columns:1fr;
}

.answer{
font-size:18px;
}

.timer{
width:70px;
height:70px;
font-size:28px;
}

}

</style>

</head>

<body>

<div class="game-container">

<!-- الجوائز -->

<div class="money-board">

<h2>💰 الجوائز</h2>

<div id="moneyList"></div>

</div>

<!-- اللعبة -->

<div class="game">

<div class="top-bar">

<div class="timer" id="timer">
30
</div>

<div class="level" id="level">
السؤال 1 / 30
</div>

</div>

<div class="question-box" id="question">
تحميل السؤال...
</div>

<div class="answers" id="answers">
</div>

<div class="help-buttons">

<button onclick="fiftyFifty()">
50 / 50
</button>

<button onclick="changeQuestion()">
تغيير السؤال
</button>

<button onclick="callFriend()">
📞 اتصال بصديق
</button>

</div>

</div>

<!-- النهاية -->

<div class="end-screen" id="endScreen">

<h1 id="endTitle">
انتهت اللعبة
</h1>

<p id="endText"></p>

<button onclick="location.reload()">
إعادة اللعب
</button>

</div>

</div>

<script>

/* الأسئلة */

const questions = [

{
q:"ما عاصمة الجزائر؟",
a:["الجزائر","وهران","سطيف","عنابة"],
c:0
},

{
q:"كم عدد كواكب المجموعة الشمسية؟",
a:["7","8","9","10"],
c:1
},

{
q:"من اخترع الهاتف؟",
a:["أينشتاين","نيوتن","غراهام بيل","تسلا"],
c:2
},

{
q:"ما أكبر محيط في العالم؟",
a:["الهندي","الأطلسي","المتجمد","الهادئ"],
c:3
},

{
q:"كم عدد أيام السنة؟",
a:["365","300","400","360"],
c:0
},

{
q:"ما أسرع حيوان بري؟",
a:["الأسد","الفهد","النمر","الذئب"],
c:1
},

{
q:"ما الكوكب الأحمر؟",
a:["المريخ","زحل","الأرض","عطارد"],
c:0
},

{
q:"من رسم الموناليزا؟",
a:["فان غوخ","بيكاسو","دافنشي","رامبرانت"],
c:2
},

{
q:"ما اللغة الرسمية في البرازيل؟",
a:["الإسبانية","الفرنسية","الإنجليزية","البرتغالية"],
c:3
},

{
q:"كم عدد القارات؟",
a:["5","6","7","8"],
c:2
},

{
q:"ما أكبر حيوان في العالم؟",
a:["الفيل","الحوت الأزرق","القرش","الزرافة"],
c:1
},

{
q:"ما عاصمة اليابان؟",
a:["سيول","بكين","طوكيو","بانكوك"],
c:2
},

{
q:"ما العنصر الذي نتنفسه؟",
a:["الهيدروجين","الأكسجين","النيتروجين","الهيليوم"],
c:1
},

{
q:"من مؤسس فيسبوك؟",
a:["إيلون ماسك","بيل غيتس","مارك زوكربيرغ","ستيف جوبز"],
c:2
},

{
q:"كم عدد ألوان قوس قزح؟",
a:["5","6","7","8"],
c:2
},

{
q:"ما أكبر قارة؟",
a:["أفريقيا","أوروبا","آسيا","أمريكا"],
c:2
},

{
q:"ما عاصمة فرنسا؟",
a:["باريس","روما","مدريد","برلين"],
c:0
},

{
q:"من مكتشف الجاذبية؟",
a:["أينشتاين","نيوتن","غاليلو","داروين"],
c:1
},

{
q:"كم عدد الأسنان عند الإنسان البالغ؟",
a:["28","30","32","34"],
c:2
},

{
q:"أين يوجد برج إيفل؟",
a:["إيطاليا","ألمانيا","فرنسا","إسبانيا"],
c:2
},

{
q:"ما أصغر دولة في العالم؟",
a:["قطر","الفاتيكان","مالطا","البحرين"],
c:1
},

{
q:"ما أطول نهر في العالم؟",
a:["النيل","الأمازون","الدانوب","الفرات"],
c:0
},

{
q:"كم عدد ساعات اليوم؟",
a:["20","22","24","26"],
c:2
},

{
q:"ما الحيوان الملقب بسفينة الصحراء؟",
a:["الحصان","الجمل","الماعز","الذئب"],
c:1
},

{
q:"ما أكبر دولة في العالم؟",
a:["الصين","أمريكا","روسيا","الهند"],
c:2
},

{
q:"ما عاصمة كندا؟",
a:["تورنتو","أوتاوا","مونتريال","فانكوفر"],
c:1
},

{
q:"من أول إنسان صعد إلى القمر؟",
a:["نيل أرمسترونغ","يوري غاغارين","أينشتاين","تسلا"],
c:0
},

{
q:"ما لون الزمرد؟",
a:["أحمر","أزرق","أخضر","أصفر"],
c:2
},

{
q:"كم عدد البحار في العالم تقريبًا؟",
a:["50","60","70","80"],
c:1
},

{
q:"ما الكوكب الأقرب للشمس؟",
a:["الأرض","المريخ","عطارد","زحل"],
c:2
}

];

/* الجوائز */

const moneyLevels = [

"100$",
"200$",
"300$",
"500$",
"1,000$",
"2,000$",
"4,000$",
"8,000$",
"16,000$",
"32,000$",
"64,000$",
"125,000$",
"250,000$",
"500,000$",
"1,000,000$",
"2,000,000$",
"3,000,000$",
"4,000,000$",
"5,000,000$",
"6,000,000$",
"7,000,000$",
"8,000,000$",
"9,000,000$",
"10,000,000$",
"15,000,000$",
"20,000,000$",
"30,000,000$",
"40,000,000$",
"50,000,000$",
"100,000,000$"

];

const questionEl =
document.getElementById("question");

const answersEl =
document.getElementById("answers");

const timerEl =
document.getElementById("timer");

const levelEl =
document.getElementById("level");

const moneyList =
document.getElementById("moneyList");

let current = 0;

let timer = 30;

let interval;

/* الجوائز */

moneyLevels.forEach((m,i)=>{

const div =
document.createElement("div");

div.classList.add("money");

if(i === 0){

div.classList.add("active");

}

div.innerText = m;

moneyList.prepend(div);

});

/* تحميل السؤال */

function loadQuestion(){

clearInterval(interval);

timer = 30;

timerEl.innerText = timer;

interval = setInterval(()=>{

timer--;

timerEl.innerText = timer;

if(timer <= 0){

loseGame();

}

},1000);

const q = questions[current];

questionEl.innerText = q.q;

answersEl.innerHTML = "";

levelEl.innerText =
`السؤال ${current+1} / 30`;

q.a.forEach((answer,index)=>{

const btn =
document.createElement("div");

btn.classList.add("answer");

btn.innerText = answer;

btn.onclick = ()=>checkAnswer(index,btn);

answersEl.appendChild(btn);

});

updateMoney();

}

/* التحقق */

function checkAnswer(index,btn){

clearInterval(interval);

const q = questions[current];

if(index === q.c){

btn.classList.add("correct");

setTimeout(()=>{

current++;

if(current >= questions.length){

winGame();

}else{

loadQuestion();

}

},1500);

}else{

btn.classList.add("wrong");

loseGame();

}

}

/* خسارة */

function loseGame(){

document.getElementById(
"endScreen"
).style.display = "flex";

document.getElementById(
"endTitle"
).innerText = "❌ خسرت";

document.getElementById(
"endText"
).innerText =
`وصلت إلى السؤال ${current+1}`;

}

/* فوز */

function winGame(){

document.getElementById(
"endScreen"
).style.display = "flex";

document.getElementById(
"endTitle"
).innerText = "🏆 مبروك";

document.getElementById(
"endText"
).innerText =
"لقد ربحت 100 مليون دولار 🎉";

}

/* تحديث الجوائز */

function updateMoney(){

const items =
document.querySelectorAll(".money");

items.forEach(item=>{

item.classList.remove("active");

});

items[
items.length - 1 - current
].classList.add("active");

}

/* 50/50 */

let used5050 = false;

function fiftyFifty(){

if(used5050) return;

used5050 = true;

const q = questions[current];

const answers =
document.querySelectorAll(".answer");

let removed = 0;

answers.forEach((a,i)=>{

if(i !== q.c && removed < 2){

a.style.visibility = "hidden";

removed++;

}

});

}

/* تغيير السؤال */

let changed = false;

function changeQuestion(){

if(changed) return;

changed = true;

current++;

if(current >= questions.length){

current = questions.length -1;

}

loadQuestion();

}

/* اتصال بصديق */

function callFriend(){

alert(
"📞 صديقك يعتقد أن الإجابة الصحيحة هي: " +
questions[current].a[
questions[current].c
]
);

}

/* بدء */

loadQuestion();

</script>

</body>
</html>
